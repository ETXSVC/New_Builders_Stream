services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies Alembic migrations before anything serves traffic,
  # mirroring docker-compose.prod.yml's own `migrate` service. This stack
  # deliberately did NOT have one for a long time, and the cost was a bad
  # first-run experience: `docker compose up` gave you six healthy
  # containers and an EMPTY database, and the first registration 500'd with
  # nothing pointing at the cause. Bootstrapping was a second, manual
  # `docker compose exec backend alembic upgrade head` that you had to know
  # about.
  #
  # `target: dev` and the source bind-mount, unlike prod's production
  # image: a migration you have just written on the host is visible to this
  # container without a rebuild, which is the whole point in dev.
  migrate:
    build:
      context: ./backend
      target: dev
    restart: "no"
    env_file: .env
    environment:
      # Same Docker-network-hostname override every other service here
      # carries, and for the identical reason — `.env` says `localhost`
      # because that is correct for HOST-side Alembic/pytest, and inside a
      # container `localhost` is the container. Without this the migration
      # step fails with `Connect call failed ('127.0.0.1', 5432)`.
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      # Alembic is the only thing that reads MIGRATIONS_DATABASE_URL
      # (tests/test_worker_db_roles.py asserts no app/ module does), and
      # `.env` points it at `localhost:5432` on purpose — that is where it
      # resolves for a developer running `alembic upgrade head` on the
      # HOST, against the port this compose file publishes.
      #
      # Inside this container, localhost is the container, so this override
      # is still required for any ad-hoc `docker compose exec backend
      # alembic ...` you run — the `migrate` service above now handles the
      # routine case, but this used to be the ONLY way the schema ever got
      # created, and it failed with connection refused against an empty
      # database.
      #
      # The `worker` service below already carries this same override for
      # the same reason. The backend was simply missed.
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Same Docker-network-hostname reason as the line above, for the same
      # class of bug. `.env` points PLATFORM_DATABASE_URL at `localhost` so
      # host-side pytest can reach the published port; inside this container
      # `localhost` is this container, and every /platform route would fail
      # with `Connect call failed ('127.0.0.1', 5432)`. The `platform_admin`
      # role is created by migration 0023.
      PLATFORM_DATABASE_URL: postgresql+asyncpg://platform_admin:${PLATFORM_DB_PASSWORD:-platform_password}@postgres:5432/${POSTGRES_DB}
    depends_on:
      # Gated on the migration completing, exactly as prod gates its own
      # backend — so this container never serves traffic against an
      # unmigrated schema. `postgres: service_healthy` is not repeated
      # because `migrate` already waits on it, so completing successfully
      # implies it.
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Document uploads (Task 1.15, design decision #4): a dedicated named
      # volume, not a subdirectory of the ./backend bind mount above, so
      # uploaded files never land inside the git-tracked backend/ source
      # tree. Mounted at app.config.Settings.storage_root's default value
      # (`/data/documents`) — keep the two in sync if either changes.
      - documents_data:/data/documents
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    # Design decision #2 (Phase 2 plan): the Dramatiq worker for async jobs
    # (PDF export, Task 2.15). Same image as `backend` — the worker imports
    # the exact same `app/` package, just runs a different entrypoint
    # against it. Not a request handler, so it does NOT get
    # `current.session` from an enqueuing request; it opens its own
    # `AsyncSession` and calls `set_current_tenant()`/`set_current_user()`
    # explicitly per job.
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      # Task 3.9 live-verification finding: `MIGRATIONS_DATABASE_URL` in
      # `.env` is deliberately `localhost:5432` (see that file's own
      # comment) because it was, until this task, only ever read by
      # host-side processes (Alembic, pytest). `_check_compliance_expiry`'s
      # owner-role engine (Task 3.8, `app/tasks/compliance_expiry.py`) also
      # reads it, and this container's own `localhost` does not resolve to
      # the `postgres` service — confirmed empirically: without this
      # override, `check_compliance_expiry()` messages reached this worker
      # and were dispatched correctly (proving the Dramatiq wiring above is
      # right), but then failed with `OSError: Connect call failed
      # ('127.0.0.1', 5432)` every time. `environment:` here overrides the
      # `env_file:` value for this service only (Compose's own documented
      # precedence) — same Docker-network-hostname pattern `DATABASE_URL`
      # above already uses for the identical reason, built from the same
      # `${POSTGRES_USER}`/`${POSTGRES_PASSWORD}`/`${POSTGRES_DB}`
      # variables `postgres:`'s own `environment:` block uses, rather than
      # duplicating literal credentials here.
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Same Docker-network-hostname reason as the line above. The
      # `scanner` role (migration 0020) is what the cross-tenant sweeps
      # actually connect as; it sees every tenant but owns nothing.
      SCANNER_DATABASE_URL: postgresql+asyncpg://scanner:${SCANNER_DB_PASSWORD:-scanner_password}@postgres:5432/${POSTGRES_DB}
    depends_on:
      # Same migration gate as `backend` above, and prod gates its worker
      # the same way: a job picked up against an unmigrated schema fails on
      # a missing table and burns all three Dramatiq retries doing it.
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # No `ports:` — this process is not HTTP-reachable, it only consumes
    # jobs from the Redis-backed queue.
    volumes:
      - ./backend:/app
      # Task 2.15: generate_estimate_pdf writes to the same
      # settings.storage_root path Documents use (Task 1.15) — the SAME
      # named volume as `backend`'s own mount above, not a second, separate
      # one, so a PDF this worker writes is actually visible/persisted for
      # a later request-handling process to read/serve, rather than landing
      # in this container's own ephemeral filesystem.
      - documents_data:/data/documents
    # Task 3.9 fix: the Dramatiq CLI only imports the module(s) named on its
    # own command line to discover `@dramatiq.actor`-decorated functions
    # (`dramatiq --help`'s own "Import extra modules" example confirms
    # multiple modules are accepted as additional positional args). Without
    # a module listed here, its actors are never registered with this worker
    # process — a message enqueued for one lands in the dead-letter queue
    # ("Received message for undefined actor"), not an error anyone sees.
    # Task 4.16 found exactly that live: app.tasks.seat_usage (Task 3.23),
    # app.tasks.flag_overdue_financial_records (Task 3.45), and
    # app.tasks.accounting_sync (Task 4.12) had all been added to app/tasks/
    # without being added here, so the scheduler's seat-usage and
    # overdue-flagging messages and every Integrations sync message were
    # being silently DLQ'd in the running stack (confirmed via worker logs).
    # Every module in app/tasks/ that defines an actor must be listed here.
    command: dramatiq app.tasks.estimate_pdf app.tasks.compliance_expiry app.tasks.seat_usage app.tasks.flag_overdue_financial_records app.tasks.accounting_sync app.tasks.send_invitation_email app.tasks.send_signature_request_email app.tasks.send_compliance_expiry_email

  scheduler:
    # Task 3.9: fires `check_compliance_expiry.send()` (Task 3.8) once daily
    # via APScheduler's `BlockingScheduler` (`app/scheduler.py`). Same image
    # as `backend`/`worker` — it only needs the `app` package importable,
    # not a different runtime. This process itself never touches the
    # database or Redis's queue contents directly; it only publishes one
    # message a day for `worker` (which DOES import
    # `app.tasks.compliance_expiry`, see that service's `command` above) to
    # pick up and execute.
    build:
      context: ./backend
      target: dev
    env_file: .env
    # Kept for defensive startup ordering even though this process itself
    # never queries postgres or redis directly (see the comment block
    # above) — Redis IS the thing `.send()` actually publishes to, and
    # requiring it healthy first avoids this container's very first
    # `add_job(...)` firing before Redis is reachable. Postgres is included
    # for consistency with every other service's own health-gated startup
    # in this file, not because this container queries it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No `ports:` — same reasoning as `worker`: not HTTP-reachable.
    volumes:
      - ./backend:/app
    command: python -m app.scheduler

  frontend:
    build:
      context: ./frontend
      target: dev
    depends_on:
      - backend
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # `.next` gets the same treatment as node_modules above, and for a
      # sharper reason than tidiness. Turbopack writes its per-route
      # compiled output here, and through the Windows bind mount that write
      # SILENTLY FAILED for the more deeply nested routes: every
      # `app/(platform)/api/.../{id}/<something>/route.ts` 404'd at runtime
      # with no compile line and no error, while `next build` produced them
      # all correctly. Confirmed by looking: `.next/dev/server/app/(app)/
      # api/estimates/[id]/approve/` existed and the equivalent
      # `(platform)` directories did not exist at all.
      #
      # Cost of an anonymous volume here is that `rm -rf frontend/.next` on
      # the HOST no longer clears the dev server's cache. To actually clear
      # it:
      #
      #     docker compose rm -sfv frontend && docker compose up -d frontend
      #
      # `-v` is the whole point and is easy to leave off. `docker compose
      # down frontend` does NOT remove an anonymous volume — only named
      # volumes in the `volumes:` section, and only with its own `-v`. An
      # earlier version of this comment recommended `down` and was simply
      # wrong: the stale `.next` survived every "clean" restart, so a route
      # that had failed to compile once stayed missing indefinitely and no
      # amount of restarting brought it back.
      - /app/.next
    environment:
      # Docker Compose network hostname, not "localhost" — the frontend container's
      # server-side fetch (app/page.tsx) runs inside its own container, where
      # "localhost" resolves to itself, not the backend container. The backend
      # service is reachable at its Compose service name via Docker's internal DNS.
      NEXT_PUBLIC_API_URL: http://backend:8000
      # Set this (in .env, comma-separated) when you browse the dev stack by
      # hostname rather than at localhost — e.g. DEV_ALLOWED_ORIGINS=solaris:3001.
      # Without it Next's dev server 403s its own fonts and HMR socket for that
      # origin while the app works normally. Empty by default, and dev-only:
      # `next build`/`next start` never read it. See frontend/next.config.ts.
      DEV_ALLOWED_ORIGINS: ${DEV_ALLOWED_ORIGINS:-}

volumes:
  pgdata:
  documents_data:
