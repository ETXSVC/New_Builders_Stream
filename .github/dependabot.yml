# Dependency updates. Without this, nothing in the repository ever notices
# that a pinned dependency has a published advisory — `pip-audit` in
# backend-ci reports one, but reporting is not upgrading, and a weekly PR is
# what turns "we would find out" into "someone has to decide".
#
# Weekly, not daily: this is a small team's repository and a daily cadence
# produces more PRs than anyone triages, which trains people to ignore them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch/minor churn, individual PRs for majors.
      # A major bump to SQLAlchemy or FastAPI needs its own review and its
      # own CI run; grouping it with six patch bumps buries that.
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    # Two major bumps cannot be taken yet, and both were reopened weekly as
    # permanently-red PRs. A red PR nobody can act on is worse than no PR:
    # it trains everyone to skim past red, which is the state the review
    # doc's own "the check went green and nobody looked" finding warns
    # about from the other direction.
    #
    # Neither is blocked by anything in this repository — both are blocked
    # on a transitive dependency that has not shipped support:
    #
    #   typescript 7  — `openapi-typescript` (which generates
    #                   lib/api/types.ts from the committed OpenAPI
    #                   snapshot) declares `peer typescript: ^5.x`, and
    #                   7.13.0 is its latest release. `npm ci` fails at
    #                   ERESOLVE before a single file is compiled. The
    #                   only ways through are --legacy-peer-deps or
    #                   --force, i.e. shipping a resolution npm itself
    #                   calls "potentially broken" for the tool our API
    #                   types are generated by. Not worth it for a
    #                   compiler bump.
    #
    #   eslint 10     — `eslint-config-next` depends on
    #                   `eslint-plugin-react ^7.37.0`, whose latest
    #                   (7.37.5) declares `peer eslint: ... || ^9.7` and
    #                   still calls `context.getFilename()`, removed in
    #                   eslint 10. Install succeeds; `eslint .` then dies
    #                   with "TypeError: contextOrFilename.getFilename is
    #                   not a function" before linting a single rule.
    #
    # Scoped to `version-update:semver-major` on these two packages only,
    # so 5.x/9.x patches and every other dependency still get PRs. Revisit
    # when eslint-plugin-react ships an eslint-10-compatible major and
    # openapi-typescript widens its TypeScript peer — delete the matching
    # entry then, rather than leaving this to rot.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  # Pinned action versions go stale silently and are a supply-chain surface
  # of their own — a compromised tag in a third-party action runs with the
  # workflow's token.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
