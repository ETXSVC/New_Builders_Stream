[project]
name = "builders-stream-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 0.140 rather than 0.115: the 0.115 line pulled starlette 0.46.x, which
    # carries nine PYSEC advisories with no fix inside that range. 0.140
    # accepts starlette 1.x, which has none. Note for future bumps: 0.140
    # stopped flattening include_router() routes into `app.routes` (it
    # stores an `_IncludedRouter` wrapper per router instead) — see
    # `iter_api_routes` in tests/test_tier_gating.py, which is the only
    # thing in this repo that walks routes directly.
    "fastapi>=0.140,<0.141",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.18.5,<1.19",
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "pyotp>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    # Required by FastAPI's Form()/File() (Task 1.15's multipart/form-data
    # document upload) — FastAPI doesn't vendor multipart parsing itself.
    "python-multipart>=0.0.32,<0.1",
    "jinja2>=3.1.6,<4.0",
    # Task 2.13 (PDF export): the plan document names WeasyPrint, but
    # WeasyPrint requires the GTK3/Pango/Cairo native runtime, which has no
    # simple pip-installable path on Windows as of WeasyPrint 69 (the
    # current official docs require a full MSYS2 toolchain install, not
    # just a small runtime installer) — a genuine local-dev-environment
    # blocker for this project's Windows-based development/test loop, not
    # a coding concern. xhtml2pdf is a deliberate substitution, made with
    # the user's explicit approval: pure Python (built on reportlab/pypdf,
    # zero native dependencies), same "render HTML via Jinja2, convert HTML
    # to PDF" architecture the task spec calls for, same `%PDF-` magic-byte
    # output contract every test in this task checks against. CSS support
    # is a real, accepted tradeoff versus WeasyPrint (less complete —
    # xhtml2pdf supports a practical CSS 2.1-ish subset, not full modern
    # CSS), acceptable for this task's explicitly simple, no-logo,
    # no-custom-styling layout requirement.
    "xhtml2pdf>=0.2.17,<0.3",
    # Task 2.14: the first real async task queue in this codebase (Phase 1's
    # design decision #2 deliberately deferred this — LEAD_WON's
    # single in-process, same-transaction consumer didn't need one). Pure
    # Python, no native dependencies (confirmed by installing it).
    "dramatiq[redis]>=2.2,<3.0",
    # Task 3.9: the scheduler service (`app/scheduler.py`) that fires
    # `check_compliance_expiry.send()` (Task 3.8) once daily. Core
    # dependency, not dev-only: it must be present in the real container
    # image the `scheduler` Docker Compose service runs from, not just this
    # venv's own test-time dependencies.
    "apscheduler>=3.10,<4.0",
    # Task 4.3: OAuth token-at-rest encryption for integration_connections
    # (docs/07-security-compliance.md Section 4's existing requirement that
    # third-party OAuth tokens are "additionally encrypted at the
    # application layer before storage, never stored in plaintext"). Already
    # present transitively via argon2-cffi/pyjwt in this project's venv, but
    # this is the first code that imports it directly.
    # >=49: the 43.x line carries five PYSEC advisories, the earliest fixed
    # in 44.0.1. Used for Fernet integration-token encryption here and,
    # transitively, by argon2-cffi and pyjwt.
    "cryptography>=49.0,<50.0",
    # Prometheus exposition for `GET /metrics` (app/core/metrics.py), which
    # docs/06 §5 asks for alongside Grafana. A hard dependency rather than
    # an extra like `observability` below, and the difference is deliberate:
    # Sentry is off unless a DSN points somewhere, so its import is
    # genuinely optional, whereas /metrics is a route on the app object and
    # a missing import would be a boot failure, not a degraded feature.
    # Pure Python, no native dependencies, no transitive deps of its own.
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
# Error reporting, off unless SENTRY_DSN is set (app/core/observability.py).
# An extra rather than a hard dependency: a deployment that wants nothing
# to do with a third-party error service should not have to install one,
# and the code degrades to a logged warning if the DSN is set without it.
observability = ["sentry-sdk[fastapi]>=2,<3"]
dev = [
    # 9.0.3+: the 8.x line carries PYSEC-2026-1845, first fixed in 9.0.3.
    # Dev-only — pytest is not in the production image — but `pip-audit`
    # runs against the dev install in CI, so leaving it pinned back means
    # the audit job reports a finding nobody can action.
    #
    # pytest-asyncio moves with it, and had to: 0.24 declares
    # `pytest<9,>=8.2`, so the two pins are one decision, not two. The 1.x
    # line drops the `event_loop` fixture deprecated back in 0.23, which
    # this suite never used — `pytest.ini`'s `asyncio_mode = auto` and
    # conftest's `@pytest_asyncio.fixture(loop_scope="function")` are both
    # unchanged API. Verified by running all 1049 tests, not by reading
    # the changelog.
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.8,<1.0",
    # tests/test_monitoring_config.py parses the Prometheus/Alertmanager/
    # Grafana config and docker-compose.prod.yml. Already present
    # transitively (uvicorn[standard]), declared here because a test
    # dependency that arrives by accident disappears the same way.
    "pyyaml>=6.0,<7.0",
    "mypy>=2.3.0,<3.0",
    # Coverage measurement. Not gated on a threshold in CI (see the
    # [tool.coverage] section below for why); the point is that a reviewer
    # can see which lines a change left untested rather than guessing.
    "pytest-cov>=7.1.0,<8.0",
    # Checks the installed dependency set against the Python advisory
    # database. Runs in backend-ci; dependabot (.github/dependabot.yml)
    # is the other half — this one reports, that one proposes the upgrade.
    "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Not cosmetic: without this, `pip install .` (the NON-editable install the
# production Docker image is built from — see backend/Dockerfile's `builder`
# stage) copies only *.py into site-packages and silently drops
# app/templates/estimate_pdf.html.jinja. Local dev and CI never noticed
# because both run an editable install, which imports straight from the
# source tree. The failure only ever appeared in a built image, at runtime,
# as a Jinja TemplateNotFound the moment a PDF export job ran — the reason
# `docker-build`'s image smoke test in .github/workflows/backend-ci.yml
# loads this template out of the installed package rather than just building
# the image. (setuptools' include_package_data default of True only picks up
# files a MANIFEST.in or a VCS plugin declares; this project has neither.)
[tool.setuptools.package-data]
app = ["templates/*.jinja"]

[tool.ruff]
# 120 rather than the 88 default: this codebase's long inline-rationale
# comments and docstrings predate any formatter; 120 keeps the lint gate
# about real defects (unused imports/vars, syntax-level mistakes), not
# wrapping churn. Default rule set (E4/E7/E9/F) on purpose — import
# sorting (I) and stylistic rule families are deliberately not enabled.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pin the classic minimal set explicitly (newer ruff versions widened the
# default): F catches real defects, E4/E7/E9 the syntax-adjacent pycodestyle
# errors. Stylistic families stay off.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Scoped to app/ (the shipped code); tests are exercised by the suite
# itself and stay outside the type gate for now. ignore_missing_imports
# covers untyped third-party packages (xhtml2pdf, dramatiq's redis broker
# internals, pyotp). The pydantic plugin teaches mypy pydantic's
# constructor/computed_field semantics.
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["app"]


[tool.coverage.run]
source = ["app"]
# The measured surface is the application, not the tests measuring it.
omit = ["app/tasks/broker.py"]

[tool.coverage.report]
exclude_also = [
    # Guard clauses for states that cannot be reached from a test but must
    # exist — re-raising after cleanup, TYPE_CHECKING blocks, and the
    # `if __name__ == "__main__"` in app/scheduler.py.
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# Deliberately NO `fail_under`. A coverage floor measures how much code a
# test suite EXECUTES, which is not the same as how much behaviour it
# checks — and once a number is a gate, the cheapest way past it is a test
# that executes code without asserting anything about it. The regression
# suites that actually protect this codebase (tenant isolation, RLS policy
# coverage, tier gating, client scoping) earn their keep by failing when a
# specific invariant breaks, not by moving a percentage. The report is here
# to show a reviewer what a change left untested.

[[tool.mypy.overrides]]
# Optional dependency — CI type-checks without it installed.
module = ["sentry_sdk.*"]
ignore_missing_imports = true
