# Fully-pinned dependency set, including transitives.
#
# `pyproject.toml` declares RANGES, which is right for a library and wrong
# for reproducing a build: two installs a week apart resolve to different
# versions, so CI green does not mean the image that ships is the thing CI
# tested. This file is what makes "the same code" mean "the same bytes".
#
# NOT installed by default. `pip install -e ".[dev]"` still resolves ranges
# — that is the loop where picking up a new patch release early is useful.
# Use this file where reproducibility matters more than freshness:
#
#     pip install -r requirements.lock
#
# Regenerate after any pyproject dependency change:
#
#     pip install -e ".[dev]" && pip freeze | grep -v "^-e \|builders-stream-backend" | sort > requirements.lock
#
# No hashes: `pip freeze` cannot emit them, and hash-pinning needs
# pip-tools or uv, which is a toolchain decision this file deliberately
# does not make on its own. Pinned versions without hashes still remove the
# entire class of "it resolved differently today" failures.
#
# Includes dev dependencies (pytest, ruff, mypy, pip-audit): CI installs
# them, so leaving them unpinned would leave CI itself irreproducible.


